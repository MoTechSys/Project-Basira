# Publishes a GitHub Release when a version tag (vX.Y.Z) is pushed.
# The release notes are the matching section of CHANGELOG.md; the job fails if that section is missing.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the CHANGELOG section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/              { exit }
            on                          { print }
          ' CHANGELOG.md > NOTES.md
          test -s NOTES.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          name: Basira ${{ github.ref_name }}
          body_path: NOTES.md
