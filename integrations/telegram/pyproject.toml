[project]
name = "basira-telegram-bot"
version = "0.1.0"
description = "Telegram bot over the Basira API: forward a text or image, get the verbatim source, its reference and the differences."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "python-telegram-bot>=22,<23",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot"]

# Same lint profile as backend/pyproject.toml.
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["bot", "tests"]
extend-exclude = ["scripts/live_e2e.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF", "SIM", "C4", "PL"]
ignore = ["PLR0913", "PLR0915", "PLR0917", "PLR2004", "RUF001", "RUF002", "RUF003", "E501", "N806", "PLR0911", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "S101", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]
known-local-folder = ["conftest", "fake_telegram"]
known-third-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["bot", "tests"]
exclude = ["^scripts/"]
mypy_path = ["tests", "../../backend"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests", "../../backend"]
