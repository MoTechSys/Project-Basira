[project]
name = "basira-backend"
version = "0.1.0"
description = "Basira — deterministic Quran/Hadith citation checker (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "rapidfuzz>=3.9",
  "openpyxl>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF", "SIM", "C4", "PL"]
ignore = ["PLR0913", "PLR0915", "PLR0917", "PLR2004", "RUF001", "RUF002", "RUF003", "E501", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff.lint.isort]
known-first-party = ["app"]
